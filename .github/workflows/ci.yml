name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: miniledger
          POSTGRES_PASSWORD: miniledger
          POSTGRES_DB: miniledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miniledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://miniledger:miniledger@localhost:5432/miniledger
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @miniledger/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @miniledger/api exec prisma migrate deploy
      - run: pnpm test
